# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

env:
  - variable: GROK_API_KEY
    secret: grok-api-key
    availability:
      - RUNTIME

  - variable: FIREBASE_SERVICE_ACCOUNT_JSON
    secret: firebase-service-account-json
    availability:
      - RUNTIME

  - variable: OWNER_UID
    value: "" # Set after first login
    availability:
      - RUNTIME

  - variable: INGEST_SECRET
    secret: ingest-secret
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_GOOGLE_MAPS_KEY
    secret: google-maps-key
    availability:
      - BUILD
      - RUNTIME

  - variable: SPARK_API_KEY
    secret: spark-api-key
    availability:
      - RUNTIME

  - variable: CRON_SECRET
    secret: cron-secret
    availability:
      - RUNTIME

  - variable: GMAIL_USER
    value: monicaselvaggio@gmail.com
    availability:
      - RUNTIME
