<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 540px; height: 400px;
    background: linear-gradient(135deg, #1E3A8A 0%, #0f2060 100%);
    font-family: -apple-system, 'SF Pro Display', sans-serif;
    color: white;
    overflow: hidden;
  }
  .top {
    text-align: center;
    padding: 40px 0 20px;
  }
  .logo { font-size: 36px; color: #A88A2A; margin-bottom: 8px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  p { font-size: 12px; opacity: 0.5; }
  .arrow-zone {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 60px;
    margin-top: 20px;
  }
  .drop-label {
    font-size: 11px;
    opacity: 0.5;
    text-align: center;
    margin-top: 80px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .arrow {
    font-size: 32px;
    color: #A88A2A;
    opacity: 0.8;
  }
</style>
</head>
<body>
  <div class="top">
    <div class="logo">✦</div>
    <h1>Monica AI Hub</h1>
    <p>Your real estate command center</p>
  </div>
  <div class="arrow-zone">
    <div style="width:120px"></div>
    <div class="arrow">→</div>
    <div style="width:120px"></div>
  </div>
  <div class="drop-label">Drag Monica AI Hub to Applications to install</div>
</body>
</html>
