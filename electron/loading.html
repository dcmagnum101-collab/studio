<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1E3A8A;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'SF Pro Display', sans-serif;
    color: white;
    -webkit-app-region: drag;
    user-select: none;
  }
  .icon { font-size: 64px; color: #A88A2A; margin-bottom: 24px; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .sub { font-size: 13px; opacity: 0.45; margin-top: 6px; margin-bottom: 48px; }
  .spinner {
    width: 28px; height: 28px;
    border: 2.5px solid rgba(255,255,255,0.15);
    border-top-color: #A88A2A;
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }
  .status {
    font-size: 11px;
    opacity: 0.35;
    margin-top: 14px;
    letter-spacing: 0.03em;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="icon">✦</div>
  <h1>Monica AI Hub</h1>
  <div class="sub">Century21 Americana · Nevada</div>
  <div class="spinner"></div>
  <div class="status" id="status">Starting up...</div>
  <script>
    const messages = [
      'Starting up...',
      'Loading your leads...',
      'Almost ready...',
      'Connecting to your data...',
    ];
    let i = 0;
    setInterval(() => {
      i = (i + 1) % messages.length;
      document.getElementById('status').textContent = messages[i];
    }, 2000);
  </script>
</body>
</html>
