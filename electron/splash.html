<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monica AI Hub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 480px;
      height: 300px;
      background: #0A0A0A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      color: #ffffff;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    .logo-ring {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #C800FF, #6B00B6);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 0 24px rgba(200, 0, 255, 0.45), 0 0 48px rgba(200, 0, 255, 0.2);
    }

    .logo-letter {
      font-size: 34px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
      letter-spacing: -1px;
    }

    .app-title {
      font-size: 22px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }

    .app-title span {
      color: #C800FF;
    }

    .subtitle {
      font-size: 12px;
      color: #666;
      margin-bottom: 32px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status {
      font-size: 12px;
      color: #555;
      letter-spacing: 0.04em;
      margin-bottom: 16px;
    }

    .dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #C800FF;
      animation: pulse 1.2s ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% {
        opacity: 0.2;
        transform: scale(0.8);
      }
      40% {
        opacity: 1;
        transform: scale(1.1);
      }
    }
  </style>
</head>
<body>
  <div class="logo-ring">
    <span class="logo-letter">M</span>
  </div>
  <div class="app-title">Monica <span>AI</span> Hub</div>
  <div class="subtitle">Real Estate Outreach Platform</div>
  <div class="status">Starting up...</div>
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</body>
</html>
