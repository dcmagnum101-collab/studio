<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1E3A8A; color: white; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: -apple-system, sans-serif;
    text-align: center; padding: 40px;
    -webkit-app-region: drag;
  }
  .icon { font-size: 48px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin-bottom: 10px; }
  p { font-size: 13px; opacity: 0.6; line-height: 1.6; max-width: 400px; }
  .action {
    margin-top: 32px;
    background: #A88A2A; color: white;
    border: none; padding: 12px 28px;
    border-radius: 8px; font-size: 14px;
    font-weight: 700; cursor: pointer;
    -webkit-app-region: no-drag;
  }
  .action:hover { opacity: 0.9; }
</style>
</head>
<body>
  <div class="icon">⚠️</div>
  <h1>Monica AI Hub couldn't start</h1>
  <p>The app ran into a problem starting up. Please quit and reopen the app. If this keeps happening, contact Derek.</p>
  <button class="action" onclick="window.location.reload()">Try Again</button>
</body>
</html>
